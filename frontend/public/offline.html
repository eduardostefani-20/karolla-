<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6A1FA0" />
    <title>Sem internet — Karolla Pet</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #54227e; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 24px; }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { opacity: 0.9; max-width: 28rem; line-height: 1.5; }
      button { margin-top: 16px; background: #f2c230; color: #2b1140; border: 0; border-radius: 999px; padding: 12px 24px; font-weight: 700; font-size: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>Você está sem internet</h1>
      <p>Para agendar ou ver sua conta, conecte-se à internet e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
